name: Publit
options:
  bundleIdPrefix: io.github.publit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple team ID here or in Xcode > Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
targets:
  Publit:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Publit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: Publit uses your location to show departures near you and to plan trips from where you are.
        ITSAppUsesNonExemptEncryption: false
        # Contact sent in the User-Agent, required by the Transitous usage policy.
        PublitContact: https://github.com/elija-7580/Publit-
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.publit.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  PublitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Publit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Publit:
    build:
      targets:
        Publit: all
        PublitTests: [test]
    test:
      targets:
        - PublitTests
